name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match "builtin-baseline" in vcpkg.json. The hosted runner ships its own
  # vcpkg checkout at an arbitrary commit; we pin it to ours so dependency
  # versions in CI are the versions developers get locally.
  VCPKG_BASELINE: 1577f17ee57f42a0ef6d75bbb82cb37d0b76d7e8
  VCPKG_DISABLE_METRICS: "1"
  CLANG_FORMAT_VERSION: "19.1.1"

jobs:
  windows:
    name: windows / msvc / ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci, ci-debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin vcpkg to the manifest baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path $root)) {
            $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone https://github.com/microsoft/vcpkg.git $root
          }
          Write-Host "vcpkg root: $root"
          git -C $root fetch --depth 1 origin $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) {
            git -C $root fetch --tags origin
            if ($LASTEXITCODE -ne 0) { throw "could not fetch vcpkg baseline" }
          }
          git -C $root checkout --force $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) { throw "could not check out vcpkg baseline" }
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed" }

          $cache = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null

          "VCPKG_ROOT=$root"                  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ matrix.preset }}-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-

      - name: Configure
        shell: pwsh
        run: ./scripts/dev-env.ps1 cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: pwsh
        run: ./scripts/dev-env.ps1 cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: pwsh
        run: ./scripts/dev-env.ps1 ctest --preset ${{ matrix.preset }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned exactly: clang-format's output drifts between major versions, so
      # an unpinned binary turns a green branch red for no reason at all.
      - name: Install clang-format
        run: pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"

      - name: Check formatting
        run: |
          set -euo pipefail
          clang-format --version
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.c')
          if [ "${#files[@]}" -eq 0 ]; then echo "no sources to check"; exit 0; fi
          clang-format --dry-run --Werror "${files[@]}"
