name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Deliberately not cancel-in-progress. Every commit on main is a milestone
  # whose definition of done includes "CI is green", and a run cancelled by the
  # next push leaves that unverified -- which is how the 26-minute hang below
  # went unnoticed for two commits.
  cancel-in-progress: false

env:
  # Must match "builtin-baseline" in vcpkg.json. The hosted runner ships its own
  # vcpkg checkout at an arbitrary commit; we pin it to ours so dependency
  # versions in CI are the versions developers get locally.
  VCPKG_BASELINE: 1577f17ee57f42a0ef6d75bbb82cb37d0b76d7e8
  VCPKG_DISABLE_METRICS: "1"
  CLANG_FORMAT_VERSION: "19.1.1"

jobs:
  windows:
    name: windows / msvc / ${{ matrix.preset }}
    runs-on: windows-latest
    # A hung job holds the concurrency group, and because cancel-in-progress is
    # off, every later push then queues behind it and each new one cancels the
    # previously queued run. One test that never returns therefore stops CI
    # running at all -- which is how three milestones in a row ended up with a
    # cancelled run and nobody the wiser. GitHub's default would let that sit
    # for six hours. A build with a warm binary cache takes about ten minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [ci, ci-debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # For scripts/check_skips.py, which wraps ctest. Pinned rather than
      # relying on whatever the runner image ships, so the skip gate cannot stop
      # working because an image changed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin vcpkg to the manifest baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path $root)) {
            $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone https://github.com/microsoft/vcpkg.git $root
          }
          Write-Host "vcpkg root: $root"
          git -C $root fetch --depth 1 origin $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) {
            git -C $root fetch --tags origin
            if ($LASTEXITCODE -ne 0) { throw "could not fetch vcpkg baseline" }
          }
          git -C $root checkout --force $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) { throw "could not check out vcpkg baseline" }
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed" }

          $cache = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null

          "VCPKG_ROOT=$root"                  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ matrix.preset }}-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-

      - name: Configure
        shell: pwsh
        run: ./scripts/dev-env.ps1 cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: pwsh
        run: ./scripts/dev-env.ps1 cmake --build --preset ${{ matrix.preset }}

      # The preset carries a per-test timeout; this is the belt to its braces,
      # so a test that wedges the whole ctest driver still fails the step
      # rather than the job.
      #
      # Through check_skips.py rather than ctest directly, because ctest's own
      # summary reports "N passed" and mentions the skips in a footnote nobody
      # reads. One skipped test survived four reported counts here -- 334, 343,
      # 346, 351 -- and it was the only test that would have revealed the
      # identity classifier had never been validated against anything. The
      # wrapper names every skip in the job summary and fails on any that is not
      # in tests/allowed_skips.txt with a written reason.
      - name: Test
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/dev-env.ps1 python scripts/check_skips.py --preset ${{ matrix.preset }}

      # The binaries, which a source grep cannot reach. tests/test_paper_only.cpp
      # asserts the same thing from inside the suite; this is the belt to its
      # braces and it runs even if that test is filtered out.
      - name: No live-money endpoints in the built binaries
        shell: pwsh
        run: python scripts/check_no_live_endpoints.py --binaries out/build/${{ matrix.preset }}/bin

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned exactly: clang-format's output drifts between major versions, so
      # an unpinned binary turns a green branch red for no reason at all.
      - name: Install clang-format
        run: pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"

      # Both run in the format job because neither needs a build, so a violation
      # fails in seconds rather than after a twenty-minute Windows build.
      - name: No live-money broker endpoints
        run: python scripts/check_no_live_endpoints.py

      - name: No credentials in the tree
        run: python scripts/check_no_secrets.py

      - name: Check formatting
        run: |
          set -euo pipefail
          clang-format --version
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.c')
          if [ "${#files[@]}" -eq 0 ]; then echo "no sources to check"; exit 0; fi
          clang-format --dry-run --Werror "${files[@]}"

  research:
    name: research / python
    runs-on: ubuntu-latest
    # Ubuntu, not Windows, and that is not a shortcut. The research layer is pure
    # Python with no dependency on the engine, the plugin ABI or MSVC, so running
    # it on Linux is both faster and a standing check that it stays that way --
    # the first import of anything Windows-specific turns this job red.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install
        run: pip install -r research/requirements.txt

      - name: Test
        # Deterministic given their seeds, so a failure here is a real failure and
        # never a flake. -p no:randomly in case anybody adds an ordering plugin:
        # several tests share module-scoped fixtures that take a minute to build.
        run: pytest -q -p no:randomly

      - name: The committed measurements still reproduce
        # Not the full sweep -- that is an hour. The quick paths exercise every
        # code path the committed numbers came from, so a change that would
        # invalidate docs/FALSE_DISCOVERY.md or the recovery figure fails here
        # rather than the next time somebody regenerates them.
        run: |
          set -euo pipefail
          python -m research.recovery --quick --out "$RUNNER_TEMP/recovery.png"
          python -m research.sweep --quick
          python -m research.ic_calibration --quick
          python -m research.sample_length --quick
          python -m research.export --out "$RUNNER_TEMP/synthetic" --periods 120 --securities 25
          python scripts/csv_to_msb.py "$RUNNER_TEMP/synthetic/bars.csv" --out "$RUNNER_TEMP/synthetic/msb"
